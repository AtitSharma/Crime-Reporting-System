{% include "base.html" %}
{% load static %}

{% block content %}

<div style="font-family: 'Segoe UI', Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 25px; background: linear-gradient(145deg, #f5f7fa 0%, #e4e8eb 100%); border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
    <form style="display: flex; flex-direction: column; gap: 15px;" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 20px;">
            {% for field in form %}
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="{{ field.id_for_label }}" style="font-weight: 600; color: #2d3748; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.help_text %}
                <small style="font-size: 12px; color: #718096; margin-top: 2px;">{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                <div style="color: #e53e3e; font-size: 12px; margin-top: 2px;">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}
        </div>
        <button type="submit" style="background: linear-gradient(to right, #4b0a56, #7c3aed); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 10px; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);">
            Update
        </button>
    </form>
</div>

<style>
    /* This will style all form inputs */
    input, textarea, select {
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        font-size: 14px;
        transition: all 0.2s;
        background-color: white;
    }
    
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #a0aec0;
        box-shadow: 0 0 0 3px rgba(164, 202, 254, 0.45);
    }
    
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3);
    }
    
    button:active {
        transform: translateY(0);
    }
</style>

  
{% endblock content %}
